services:
  cloud-api:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
    # Phase 3+: add volume for model weights
    # volumes:
    #   - ./model_weights:/app/model_weights

  vessel-api:
    build:
      context: .
      dockerfile: vessel/Dockerfile
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: /app
      CLOUD_API_URL: http://cloud-api:8000
    depends_on:
      - cloud-api
    # Phase 5+: add volume for persistent SQLite cache
    # volumes:
    #   - vessel-cache:/app/vessel/cache/data

